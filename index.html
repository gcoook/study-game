<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>学习闯关 - 游戏化学习反馈系统</title>
    <!-- PWA配置 -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.jpg">
    <!-- 引入样式文件 -->
    <link rel="stylesheet" href="style.css">
    <!-- Service Worker注册 -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('SW注册成功'))
                .catch(err => console.log('SW注册失败:', err));
        }
    </script>
</head>
<body>

    <!-- ============================================ -->
    <!-- 首次使用 - 设置页面 -->
    <!-- 用户第一次打开时显示，输入基本信息后进入主界面 -->
    <!-- ============================================ -->
    <div id="setup-page" class="page">
        <div class="setup-container">
            <!-- 应用标题和Logo区域 -->
            <div class="setup-header">
                <div class="logo-icon">
                    <!-- 用纯CSS绘制的书本+星星图标 -->
                    <span class="logo-star">&#9733;</span>
                    <span class="logo-book">&#128218;</span>
                </div>
                <h1 class="setup-title">学习闯关</h1>
                <p class="setup-subtitle">把学习变成一场冒险</p>
            </div>

            <!-- 登录/注册切换标签 -->
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login" onclick="app.switchAuthTab('login')">登录</button>
                <button class="auth-tab" data-tab="register" onclick="app.switchAuthTab('register')">注册</button>
            </div>

            <!-- 登录表单 -->
            <form class="setup-form" id="login-form">
                <div class="form-group">
                    <label>账号</label>
                    <input type="text" id="login-username" placeholder="输入账号" maxlength="20" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="login-password" placeholder="输入密码" maxlength="20" required>
                </div>
                <button type="submit" class="btn-primary" onclick="app.login(event)">登录</button>
            </form>

            <!-- 注册表单（默认隐藏） -->
            <form class="setup-form" id="register-form" style="display: none;">
                <div class="form-group">
                    <label>设置账号</label>
                    <input type="text" id="register-username" placeholder="输入账号（2-20字符）" minlength="2" maxlength="20" required>
                </div>
                <div class="form-group">
                    <label>设置密码</label>
                    <input type="password" id="register-password" placeholder="输入密码（4-20字符）" minlength="4" maxlength="20" required>
                </div>
                <div class="form-group">
                    <label>确认密码</label>
                    <input type="password" id="register-password-confirm" placeholder="再次输入密码" minlength="4" maxlength="20" required>
                </div>
                <div class="form-group">
                    <label>你的全省排名</label>
                    <input type="number" id="register-rank" placeholder="输入当前排名" min="1" max="85000" required>
                </div>
                <button type="submit" class="btn-primary" onclick="app.register(event)">注册</button>
            </form>

            <!-- 错误提示 -->
            <div id="auth-error" class="auth-error" style="display: none;"></div>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- 主应用页面 -->
    <!-- 包含首页、任务、排行三个Tab页 -->
    <!-- ============================================ -->
    <div id="main-page" class="page" style="display: none;">

        <!-- 顶部标题栏 -->
        <header class="app-header">
            <div class="header-left">
                <span class="header-icon">&#9733;</span>
                <span id="header-nickname" class="header-nickname">冒险者</span>
            </div>
            <div class="header-right">
                <div class="streak-badge">
                    <span class="streak-fire">&#128293;</span>
                    <span id="header-streak-num">0</span>天连胜
                </div>
            </div>
        </header>

        <!-- 内容区域（三个Tab页的内容） -->
        <main class="app-content">

            <!-- ======================================== -->
            <!-- Tab1: 首页 - 今日概览 -->
            <!-- ======================================== -->
            <section id="tab-home" class="tab-content active">
                <!-- 顶部：排名（简洁显示） -->
                <div class="header-rank">
                    <span class="header-rank-label">全省排名</span>
                    <span id="current-rank" class="header-rank-number">--</span>
                    <span id="rank-percentile" class="header-rank-percent">前 --%</span>
                </div>

                <!-- 中间：今日待办（最大区域） -->
                <div class="card todo-card main-todo">
                    <div class="todo-header">
                        <span class="todo-title">&#128221; 今日待办</span>
                        <span class="todo-count" id="todo-count">0 个任务</span>
                    </div>
                    <div id="todo-list" class="todo-list main-todo-list">
                        <!-- JS动态生成未做任务列表 -->
                    </div>
                    <div id="todo-empty" class="todo-empty" style="display: none;">
                        <span>&#127881;</span>
                        <p>太棒了！今日任务全部完成</p>
                    </div>
                </div>

                <!-- 下方：其他信息（简化显示） -->
                <div class="stats-row">
                    <div class="stat-mini">
                        <span class="stat-mini-icon">&#9889;</span>
                        <span class="stat-mini-value" id="today-xp">0</span>
                        <span class="stat-mini-label">今日XP</span>
                    </div>
                    <div class="stat-mini">
                        <span class="stat-mini-icon">&#128293;</span>
                        <span class="stat-mini-value" id="streak-days">0</span>
                        <span class="stat-mini-label">连胜</span>
                    </div>
                    <div class="stat-mini">
                        <span class="stat-mini-icon">&#127919;</span>
                        <span class="stat-mini-value" id="daily-target">0/2</span>
                        <span class="stat-mini-label">今日目标</span>
                    </div>
                </div>

                <!-- 排名趋势（折叠/简化） -->
                <div class="card trend-card compact">
                    <div class="card-label">排名趋势</div>
                    <div class="trend-chart" id="home-trend-chart"></div>
                </div>

                <!-- 每日结算倒计时 -->
                <div class="card countdown-card-mini" id="countdown-card-mini">
                    <div class="countdown-mini-left">
                        <span class="countdown-mini-icon">&#9200;</span>
                        <span class="countdown-mini-title">距离结算</span>
                    </div>
                    <div class="countdown-mini-right">
                        <span class="countdown-mini-time" id="countdown-mini">--:--:--</span>
                        <span class="countdown-mini-status" id="countdown-mini-status">正常</span>
                    </div>
                </div>

            </section>

            <!-- ======================================== -->
            <!-- Tab2: 任务 - 任务列表 -->
            <!-- ======================================== -->
            <section id="tab-tasks" class="tab-content">
                <!-- 任务统计 -->
                <div class="task-summary">
                    <span>今日已完成 <strong id="tasks-done-count">0</strong> / <strong id="tasks-total-count">0</strong> 个任务</span>
                </div>

                <!-- 添加任务区域 -->
                <div class="add-task-area">
                    <input type="text" id="task-input" placeholder="输入新任务，例如：背30个英语单词" maxlength="50">
                    <button class="btn-add" onclick="app.addTask()">
                        <span>+</span>
                    </button>
                </div>

                <!-- 任务配置区域 -->
                <div class="task-config-area">
                    <!-- 第一行：类型选择 -->
                    <div class="task-type-row">
                        <label class="type-btn required active">
                            <input type="radio" name="task-type" value="required" checked>
                            &#128221; 必做
                        </label>
                        <label class="type-btn extra">
                            <input type="radio" name="task-type" value="extra">
                            &#11088; 拓展
                        </label>
                    </div>
                    
                    <!-- 第二行：科目选择 -->
                    <div class="subject-selector">
                        <div class="subject-row" id="subject-row">
                            <button class="subject-btn active" data-subject="chinese">语文</button>
                            <button class="subject-btn" data-subject="math">数学</button>
                            <button class="subject-btn" data-subject="english">英语</button>
                            <button class="subject-btn" data-subject="politics">政治</button>
                            <button class="subject-btn" data-subject="history">历史</button>
                            <button class="subject-btn" data-subject="geo">地理</button>
                        </div>
                    </div>
                    
                    <!-- 第三行：预设任务列表 -->
                    <div class="preset-tasks-area">
                        <div class="preset-header">
                            <span class="preset-title">快速选择</span>
                            <button class="btn-manage-preset" onclick="app.openPresetManager()">管理预设</button>
                        </div>
                        <div class="preset-list" id="preset-list">
                            <!-- JS动态生成预设任务 -->
                        </div>
                    </div>
                    
                    <!-- 第四行：星级选择 -->
                    <div class="star-selector">
                        <span class="star-label">难度：</span>
                        <div class="stars" id="star-selector">
                            <span class="star" data-star="1">&#9733;</span>
                            <span class="star" data-star="2">&#9733;</span>
                            <span class="star" data-star="3">&#9733;</span>
                            <span class="star" data-star="4">&#9733;</span>
                            <span class="star" data-star="5">&#9733;</span>
                        </div>
                        <span class="star-xp" id="star-xp-display">50 XP</span>
                    </div>
                </div>
                
                <!-- 预设任务管理弹窗 -->
                <div id="preset-modal" class="modal" style="display: none;">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h3>管理预设任务</h3>
                            <button class="btn-close" onclick="app.closePresetManager()">&times;</button>
                        </div>
                        <div class="modal-body">
                            <div class="current-subject-display">
                                当前科目：<span id="modal-subject-name">语文</span>
                            </div>
                            <div class="preset-input-area">
                                <input type="text" id="new-preset-input" placeholder="输入新的预设任务" maxlength="30">
                                <button class="btn-add-preset" onclick="app.addPreset()">添加</button>
                            </div>
                            <div class="preset-manage-list" id="preset-manage-list">
                                <!-- JS动态生成管理列表 -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 任务列表 -->
                <div id="task-list" class="task-list">
                    <!-- JS会动态生成任务卡片 -->
                </div>

                <!-- 空状态提示 -->
                <div id="empty-tasks" class="empty-state">
                    <div class="empty-icon">&#128203;</div>
                    <p>还没有任务，添加一个开始学习吧！</p>
                </div>
            </section>

            <!-- ======================================== -->
            <!-- Tab3: 排行 - 排名历史 -->
            <!-- ======================================== -->
            <section id="tab-ranking" class="tab-content">
                <div class="card ranking-card">
                    <div class="card-label">排名历史（最近7天）</div>
                    <div class="ranking-chart" id="ranking-chart">
                        <!-- JS会在这里动态绘制柱状图 -->
                    </div>
                </div>

                <!-- 排名详细数据 -->
                <div class="card ranking-detail-card">
                    <div class="card-label">详细数据</div>
                    <div id="ranking-detail-list" class="ranking-detail-list">
                        <!-- JS会动态生成排名详情 -->
                    </div>
                </div>
            </section>

            <!-- ======================================== -->
            <!-- Tab4: 设置 -->
            <!-- ======================================== -->
            <section id="tab-settings" class="tab-content">
                <div class="settings-section">
                    <div class="settings-title">账号信息</div>
                    <div class="card settings-card">
                        <div class="settings-item">
                            <span class="settings-label">账号</span>
                            <span class="settings-value" id="settings-username">-</span>
                        </div>
                        <div class="settings-item">
                            <span class="settings-label">当前排名</span>
                            <span class="settings-value" id="settings-rank">-</span>
                        </div>
                        <div class="settings-item">
                            <span class="settings-label">连胜天数</span>
                            <span class="settings-value" id="settings-streak">-</span>
                        </div>
                    </div>
                </div>

                <div class="settings-section">
                    <div class="settings-title">数据管理</div>
                    <div class="card settings-card">
                        <button class="settings-btn" onclick="app.exportData()">&#128190; 导出数据</button>
                        <button class="settings-btn" onclick="app.importData()">&#128194; 导入数据</button>
                        <input type="file" id="import-file" accept=".json" style="display: none;" onchange="app.handleImportFile(event)">
                    </div>
                </div>

                <div class="settings-section">
                    <div class="settings-title">其他</div>
                    <div class="card settings-card">
                        <button class="settings-btn settings-btn-danger" onclick="app.logout()">&#128682; 退出登录</button>
                    </div>
                </div>

                <div class="settings-version">学习闯关 v1.3 正式版</div>
            </section>

        </main>

        <!-- 底部Tab导航栏 -->
        <nav class="tab-bar">
            <div class="tab-item active" data-tab="home" onclick="app.switchTab('home')">
                <span class="tab-icon">&#127968;</span>
                <span class="tab-label">首页</span>
            </div>
            <div class="tab-item" data-tab="tasks" onclick="app.switchTab('tasks')">
                <span class="tab-icon">&#128203;</span>
                <span class="tab-label">任务</span>
            </div>
            <div class="tab-item" data-tab="ranking" onclick="app.switchTab('ranking')">
                <span class="tab-icon">&#127942;</span>
                <span class="tab-label">排行</span>
            </div>
            <div class="tab-item" data-tab="settings" onclick="app.switchTab('settings')">
                <span class="tab-icon">&#9881;</span>
                <span class="tab-label">设置</span>
            </div>
        </nav>
    </div>

    <!-- ============================================ -->
    <!-- XP飞出动画容器 -->
    <!-- 完成任务时显示 "+100 XP" 飞出效果 -->
    <!-- ============================================ -->
    <div id="xp-animation-container" class="xp-animation-container"></div>

    <!-- ============================================ -->
    <!-- 排名变动动画容器 -->
    <!-- 排名变化时显示上升/下降动画 -->
    <!-- ============================================ -->
    <div id="rank-animation-container" class="rank-animation-container"></div>

    <!-- 引入核心逻辑文件 -->
    <script src="app.js"></script>
</body>
</html>
